name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build bot_amd64.so (mieru core)
        working-directory: bot
        env:
          GOAMD64: v1
        run: |
          go version
          go get github.com/enfein/mieru/v3@93a1dd62eac208c298d6da2460e134d47144cc79
          go mod tidy
          mkdir -p ../dist
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -buildmode=c-shared -o ../dist/bot_amd64.so .
          ls -la ../dist/

      - name: Audit non-baseline instruction sites
        run: |
          objdump -d dist/bot_amd64.so > /tmp/bot.asm || true
          echo "== BMI2 pdep/pext symbol context =="
          awk '/^[0-9a-f]+ </{sym=$2} /pdep|pext/{if(!seen[sym]++) print sym}' /tmp/bot.asm | head -20
          echo "== popcnt sites =="
          grep -cE "\bpopcnt\b" /tmp/bot.asm || echo "none"
          echo "== SSE4.x sites =="
          grep -cE "\bpcmpestr|\bpcmpistr|\bpblendvb|\bpmulld|\baesdec|\baesenc|\bpclmulqdq" /tmp/bot.asm || echo "none"
          echo "== AVX/AVX2 sites =="
          grep -cE "\bvmovdq|\bvpaddd|\bvpxor|\bvmulps|\bvgf2p8" /tmp/bot.asm || echo "none"

      - name: QEMU cpu-feature bisect (reproduce SIGILL)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static
          cat > probe.c <<'PROBE'
          #include <dlfcn.h>
          #include <stdio.h>
          int main(int argc, char **argv) {
              void *h = dlopen(argv[1], RTLD_NOW);
              if (!h) { printf("dlopen-failed: %s\n", dlerror()); return 3; }
              printf("dlopen-ok\n");
              if (!dlsym(h, "StartBot")) { printf("sym-missing\n"); return 4; }
              printf("sym-ok\n");
              return 0;
          }
          PROBE
          gcc -O2 -o probe probe.c -ldl
          for FEAT in "" "+popcnt" "+sse4.1" "+sse4.2" "+bmi2" "+avx"; do
            echo "== qemu64 $FEAT =="
            qemu-x86_64-static -cpu "qemu64$FEAT" ./probe dist/bot_amd64.so && echo "PASS" || echo "FAIL"
          done

      - name: Fetch status_amd64.so (nezha v1 agent, renamed from v1.so)
        run: |
          curl -fsSL -o dist/status_amd64.so https://amd64.oooen.com/v1.so
          ls -la dist/

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: mieru-libs v1.0.${{ github.run_number }}
          files: |
            dist/bot_amd64.so
            dist/status_amd64.so
