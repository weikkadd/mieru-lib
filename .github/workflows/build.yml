name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go 1.20.14
        uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache: false

      - name: Build bot with Go 1.20
        working-directory: bot
        env:
          GOAMD64: v1
        run: |
          go version
          go get github.com/enfein/mieru/v3@93a1dd62eac208c298d6da2460e134d47144cc79
          go mod tidy
          mkdir -p ../dist
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -buildmode=c-shared -o ../dist/bot_go120.so .
          ls -la ../dist/

      - name: Set up Go 1.21
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Build hello (Go 1.21) and bot (Go 1.21)
        run: |
          go version
          mkdir -p dist
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -buildmode=c-shared -o dist/hello_go121.so ./hello
          cd bot
          GOAMD64=v1 go get github.com/enfein/mieru/v3@93a1dd62eac208c298d6da2460e134d47144cc79
          GOAMD64=v1 go mod tidy
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -buildmode=c-shared -o ../dist/bot_go121.so .
          ls -la ../dist/

      - name: QEMU bisect matrix
        run: |
          chmod +x qemu_test.sh
          bash qemu_test.sh

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: mieru-libs v1.0.${{ github.run_number }}
          files: |
            dist/bot_go120.so
            dist/bot_go121.so
            dist/status_amd64.so
